<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Metropole Studios</title>
<meta name="description" content="Metropole Studios — Minecraft servers, plugins, mods, bots and development.">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b0d12;color:#f5f7fb}button,input{font:inherit}button{cursor:pointer}
:root{--card:#131720;--muted:#9ca6b8;--line:#252b37;--accent:#7c5cff;--accent2:#a78bfa}
header{position:sticky;top:0;z-index:20;background:rgba(11,13,18,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{max-width:1100px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:14px}.logo{font-weight:900;font-size:19px;white-space:nowrap}.logo span{color:var(--accent2)}
.navlinks{display:flex;gap:8px;margin-left:auto}.navlinks button,.iconbtn{background:transparent;border:1px solid transparent;color:#dbe1ec;padding:9px 11px;border-radius:10px}.navlinks button:hover,.iconbtn:hover{background:var(--card)}
main{max-width:1100px;margin:auto;padding:22px 18px 90px}.hero{padding:40px 0 28px;display:grid;grid-template-columns:1.3fr .7fr;gap:20px;align-items:center}.eyebrow{color:var(--accent2);font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:1.5px}
h1{font-size:clamp(36px,7vw,64px);line-height:1.02;margin:10px 0 15px}h2{margin:0 0 14px}h3{margin:0 0 7px}.sub{color:var(--muted);line-height:1.65}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.primary,.secondary{border:0;border-radius:12px;padding:12px 16px;font-weight:800}.primary{background:var(--accent);color:white}.secondary{background:var(--card);border:1px solid var(--line);color:white}
.heroCard{background:linear-gradient(145deg,#181b2a,#10131b);border:1px solid #2c3141;border-radius:20px;padding:22px;box-shadow:0 20px 50px #0005}.stat{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.stat:last-child{border:0}
.section{margin-top:34px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px}.price{font-weight:900;font-size:20px;margin-top:12px}.muted{color:var(--muted);font-size:14px}.tag{display:inline-block;background:#201b39;color:#cfc4ff;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}
.search{width:100%;background:#10131a;border:1px solid var(--line);border-radius:12px;color:white;padding:13px;margin:10px 0 15px}
.pageTitle{padding:18px 0}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.empty{text-align:center;padding:45px 15px;color:var(--muted)}
.product{display:flex;flex-direction:column;min-height:210px}.product .bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:end;gap:8px}
table{width:100%;border-collapse:collapse}.tablewrap{overflow:auto}.tablewrap td,.tablewrap th{text-align:left;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#f5f7fb;color:#111;padding:11px 16px;border-radius:12px;font-weight:700;display:none;z-index:50}
footer{border-top:1px solid var(--line);padding:25px 18px;color:var(--muted);text-align:center}
.mobilebar{display:none}
@media(max-width:700px){.hero{grid-template-columns:1fr;padding-top:25px}.grid{grid-template-columns:1fr}.navlinks{display:none}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#10131a;border-top:1px solid var(--line);z-index:30;justify-content:space-around;padding:8px}.mobilebar button{background:none;border:0;color:#cbd3e2;font-size:11px}.mobilebar b{display:block;font-size:18px}.heroCard{display:none}main{padding-bottom:90px}}
</style>
</head>
<body>
<header><div class="nav"><div class="logo">METROPOLE <span>STUDIOS</span></div><div class="navlinks">
<button onclick="show('home')">Home</button><button onclick="show('store')">Store</button><button onclick="show('orders')">Orders</button><button onclick="show('support')">Support</button><button onclick="show('account')">Account</button><button onclick="show('admin')">Admin</button>
</div><button class="iconbtn" onclick="show('cart')">🛒 <span id="cartCount">0</span></button></div></header>
<main id="app"></main>
<div class="mobilebar"><button onclick="show('home')"><b>⌂</b>Home</button><button onclick="show('store')"><b>▦</b>Store</button><button onclick="show('orders')"><b>✓</b>Orders</button><button onclick="show('support')"><b>?</b>Support</button><button onclick="show('account')"><b>●</b>Account</button></div>
<div id="toast" class="toast"></div>
<footer>© 2026 Metropole Studios · Customer store + management starter</footer>
<script>
const products=[
{id:1,name:"Minecraft Premade Server",cat:"Minecraft Servers",price:29.99,desc:"A ready-to-use Minecraft server package."},
{id:2,name:"Premium Plugin Pack",cat:"Plugins",price:14.99,desc:"Useful plugins packaged for your server."},
{id:3,name:"Modded Server Pack",cat:"Mods",price:24.99,desc:"A curated modded Minecraft setup."},
{id:4,name:"Resource Pack",cat:"Resource Packs",price:9.99,desc:"A polished resource pack for your community."},
{id:5,name:"Discord Bot",cat:"Discord Bots",price:19.99,desc:"A configurable Discord bot starter."},
{id:6,name:"Website Package",cat:"Websites",price:39.99,desc:"Responsive website setup for your project."},
{id:7,name:"Minecraft Server Setup",cat:"Services",price:49.99,desc:"Professional server setup and configuration."},
{id:8,name:"Custom Development",cat:"Services",price:59.99,desc:"Custom development for your community."},
{id:9,name:"Hosting",cat:"Hosting",price:0,desc:"Hosting is coming soon."}
];
let cart=JSON.parse(localStorage.getItem("metroCart")||"[]");
function save(){localStorage.setItem("metroCart",JSON.stringify(cart));document.getElementById("cartCount").textContent=cart.length}
function money(n){return n?`$${n.toFixed(2)}`:"Coming Soon"}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.style.display="block";setTimeout(()=>t.style.display="none",1700)}
function show(page,id){
let a=document.getElementById("app");
if(page==="home")a.innerHTML=home();
if(page==="store")a.innerHTML=store();
if(page==="product")a.innerHTML=product(id);
if(page==="cart")a.innerHTML=cartPage();
if(page==="orders")a.innerHTML=orders();
if(page==="support")a.innerHTML=support();
if(page==="account")a.innerHTML=account();
if(page==="admin")a.innerHTML=admin();
save();window.scrollTo(0,0)
}
function home(){return `<section class="hero"><div><div class="eyebrow">Digital products & development</div><h1>Build your server.<br><span style="color:var(--accent2)">Build your community.</span></h1><p class="sub">Metropole Studios provides Minecraft products, Discord bots, websites and custom development for growing communities.</p><div class="actions"><button class="primary" onclick="show('store')">Browse Store</button><button class="secondary" onclick="show('support')">Get Support</button></div></div><div class="heroCard"><h3>Metropole Studios</h3><div class="stat"><span>Products</span><b>9</b></div><div class="stat"><span>Support</span><b>24/7</b></div><div class="stat"><span>Hosting</span><b>Coming Soon</b></div></div></section>
<section class="section"><div class="row"><h2>Popular products</h2><button class="secondary" onclick="show('store')">View all</button></div><div class="grid">${products.slice(0,6).map(card).join("")}</div></section>
<section class="section"><div class="card"><span class="tag">Announcement</span><h2 style="margin-top:10px">Welcome to Metropole Studios</h2><p class="sub">Our new customer store is live. More automation, payment options and hosting features can be connected as the platform grows.</p></div></section>`}
function card(p){return `<div class="card product"><div><span class="tag">${p.cat}</span><h3 style="margin-top:12px">${p.name}</h3><p class="muted">${p.desc}</p></div><div class="bottom"><div class="price">${money(p.price)}</div>${p.price?`<button class="primary" onclick="add(${p.id})">Add</button>`:`<button class="secondary" onclick="toast('Hosting is coming soon')">Soon</button>`}</div></div>`}
function store(){return `<div class="pageTitle"><div class="eyebrow">Store</div><h1 style="font-size:40px">Products</h1><input class="search" id="search" oninput="filterStore()" placeholder="Search products..."></div><div id="productsGrid" class="grid">${products.map(card).join("")}</div>`}
function filterStore(){let q=document.getElementById("search").value.toLowerCase();document.getElementById("productsGrid").innerHTML=products.filter(p=>(p.name+p.cat+p.desc).toLowerCase().includes(q)).map(card).join("")}
function product(id){let p=products.find(x=>x.id==id);return `<div class="pageTitle"><button class="secondary" onclick="show('store')">← Store</button></div><div class="card"><span class="tag">${p.cat}</span><h1 style="font-size:42px">${p.name}</h1><p class="sub">${p.desc}</p><div class="price">${money(p.price)}</div>${p.price?`<button class="primary" style="margin-top:18px" onclick="add(${p.id})">Add to Cart</button>`:""}</div>`}
function add(id){let p=products.find(x=>x.id===id);if(!p.price)return toast("Coming soon");cart.push(p);save();toast(p.name+" added to cart")}
function cartPage(){if(!cart.length)return `<div class="empty"><h2>Your cart is empty</h2><p>Browse the store to add products.</p><button class="primary" onclick="show('store')">Browse Store</button></div>`;let total=cart.reduce((s,p)=>s+p.price,0);return `<div class="pageTitle"><h1 style="font-size:40px">Cart</h1></div><div class="grid"><div class="card" style="grid-column:1/-1">${cart.map((p,i)=>`<div class="row" style="padding:13px 0;border-bottom:1px solid var(--line)"><div><b>${p.name}</b><div class="muted">${money(p.price)}</div></div><button class="secondary" onclick="cart.splice(${i},1);save();show('cart')">Remove</button></div>`).join("")}<div class="row" style="padding-top:17px"><h3>Total</h3><h3>${money(total)}</h3></div><button class="primary" onclick="toast('Demo checkout — connect a payment provider later')">Checkout</button></div></div>`}
function orders(){let orders=JSON.parse(localStorage.getItem("metroOrders")||"[]");return `<div class="pageTitle"><div class="eyebrow">Customer</div><h1 style="font-size:40px">My Orders</h1></div>${orders.length?orders.map(o=>`<div class="card" style="margin-bottom:10px"><div class="row"><b>Order #${o.id}</b><span class="tag">${o.status}</span></div><p class="muted">${o.items.join(", ")}</p></div>`).join(""):`<div class="empty">No orders yet.</div>`}
function support(){return `<div class="pageTitle"><div class="eyebrow">Help Center</div><h1 style="font-size:40px">Support</h1></div><div class="grid"><div class="card"><h3>AI Support Assistant</h3><p class="muted">Common questions can be answered here in the future.</p><button class="primary" onclick="toast('AI support placeholder')">Open Assistant</button></div><div class="card"><h3>Support Ticket</h3><p class="muted">Need staff help? Create a ticket.</p><button class="secondary" onclick="toast('Ticket form coming next')">Create Ticket</button></div><div class="card"><h3>Discord</h3><p class="muted">Join the community for updates and support.</p><button class="secondary" onclick="toast('Add your Discord invite later')">Open Discord</button></div></div>`}
function account(){return `<div class="pageTitle"><div class="eyebrow">Customer</div><h1 style="font-size:40px">Account</h1></div><div class="card"><h3>Guest account</h3><p class="muted">Authentication can be connected later with Supabase or another provider.</p><button class="primary" onclick="toast('Login system coming next')">Sign In</button></div>`}
function admin(){return `<div class="pageTitle"><div class="eyebrow">Management</div><h1 style="font-size:40px">Admin Dashboard</h1></div><div class="grid"><div class="card"><span class="tag">Orders</span><h2>0</h2><p class="muted">Manage customer orders.</p></div><div class="card"><span class="tag">Products</span><h2>9</h2><p class="muted">Add, edit and remove products.</p></div><div class="card"><span class="tag">Revenue</span><h2>$0</h2><p class="muted">Connect payments for live revenue.</p></div><div class="card"><span class="tag">Tickets</span><h2>0</h2><p class="muted">Manage support tickets.</p></div><div class="card"><span class="tag">Coupons</span><h2>0</h2><p class="muted">Coupon management placeholder.</p></div><div class="card"><span class="tag">Staff</span><h2>0</h2><p class="muted">Staff permissions placeholder.</p></div></div>`}
show("home");
</script>
</body>
</html>
